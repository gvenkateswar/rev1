<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sing to Score</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E4E7E2; --paper-2:#D6DBD4; --ink:#14201B; --ink-2:#4A5751;
    --muted:#8A9A91; --live:#2D6A4F; --live-soft:rgba(45,106,79,.18); --rec:#9C3B2E;
    --space:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{padding:22px 20px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1}
  h1 em{font-style:italic;font-weight:500}
  .status{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);text-align:right;line-height:1.35;min-width:90px}
  .status b{font-weight:500;color:var(--ink);font-size:15px;display:block}
  main{flex:1;display:flex;flex-direction:column;gap:14px;padding:6px 12px 20px}
  .score{position:relative;background:var(--paper);border-top:1px solid var(--paper-2);border-bottom:1px solid var(--paper-2)}
  canvas{display:block;width:100%;touch-action:pan-y}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);font-family:"Fraunces",serif;font-style:italic;font-size:15px;transition:opacity .3s}
  .empty.hide{opacity:0}
  .controls{display:flex;align-items:center;gap:14px;padding:0 8px;flex-wrap:wrap}
  .rec{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
  .rec::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--rec);transition:border-radius .2s,transform .2s}
  .rec.on{border-color:var(--rec);background:rgba(156,59,46,.08)}
  .rec.on::after{border-radius:4px;transform:scale(.85)}
  .rec:focus-visible{outline:2px solid var(--live);outline-offset:3px}
  .lbl{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
  .lbl strong{font-weight:500;color:var(--ink)}
  .tempo{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:13px;margin-left:auto}
  input[type=range]{accent-color:var(--ink);width:120px}
  .actions{display:flex;gap:8px;padding:0 8px;flex-wrap:wrap}
  button.txt{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--ink-2);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
  button.txt:disabled{opacity:.35;cursor:default}
  button.txt:focus-visible{outline:2px solid var(--live);outline-offset:2px}
  .notes{font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.9;color:var(--ink-2);padding:0 8px;word-break:break-word;min-height:1.9em}
  .notes span{color:var(--ink);margin-right:.6em;white-space:nowrap}
  .hint{font-size:12px;color:var(--muted);padding:0 8px}
  .err{color:var(--rec);font-size:13px;padding:0 8px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Sing to <em>score</em></h1>
  <div class="status" id="status"><b>—</b>ready</div>
</header>
<main>
  <div class="score">
    <canvas id="cv"></canvas>
    <div class="empty" id="empty">Press record and sing a phrase. The staff listens.</div>
  </div>
  <div class="controls">
    <button class="rec" id="rec" aria-label="Record"></button>
    <div class="lbl"><strong id="recLabel">Record</strong><span id="recSub">tap, sing, tap again</span></div>
    <label class="tempo">♩ = <span id="bpmv">96</span><input type="range" id="bpm" min="60" max="160" value="96"></label>
  </div>
  <div class="actions">
    <button class="txt" id="play" disabled>Play back</button>
    <button class="txt" id="copy" disabled>Copy ABC</button>
    <button class="txt" id="clear" disabled>Clear</button>
  </div>
  <div class="notes" id="notes"></div>
  <div class="err" id="err"></div>
  <div class="hint">Best with a single unaccompanied voice, hummed or sung on a vowel. Pitch snaps to the nearest semitone; timing snaps to eighth notes at the tempo above.</div>
</main>

<script>
// ---------- state ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let audioCtx, analyser, stream, buf, rafId;
let recording=false, samples=[], t0=0, score=null, liveMidi=null, octaveShift=0;
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LETTER=[0,0,1,1,2,3,3,4,4,5,5,6]; // diatonic letter index per pitch class (sharps)
const SHARP=[0,1,0,1,0,0,1,0,1,0,1,0];

// ---------- pitch detection (YIN) ----------
function detect(b,sr){
  let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);
  if(rms<0.012)return null;
  const n=b.length,maxTau=Math.floor(sr/70),minTau=Math.floor(sr/1000),W=n-maxTau;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+tau];s+=x*x;}d[tau]=s;}
  const c=new Float32Array(maxTau+1);c[0]=1;let run=0;
  for(let tau=1;tau<=maxTau;tau++){run+=d[tau];c[tau]=d[tau]*tau/(run||1e-9);}
  let tau=-1;
  for(let t=minTau;t<maxTau;t++){if(c[t]<0.14){while(t+1<maxTau&&c[t+1]<c[t])t++;tau=t;break;}}
  if(tau<0)return null;
  const a=c[tau-1],m=c[tau],z=c[tau+1],den=(a-2*m+z);
  const shift=den!==0?0.5*(a-z)/den:0;
  return sr/(tau+shift);
}
const f2m=f=>69+12*Math.log2(f/440);
const m2f=m=>440*Math.pow(2,(m-69)/12);
const mname=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const diat=m=>(Math.floor(m/12))*7+LETTER[((m%12)+12)%12];
const diatF=m=>30+(m-64)*7/12; // approx continuous diatonic for the live trace (E4 = 30)

// ---------- recording ----------
async function start(){
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){$('err').textContent='Microphone access was blocked. Allow the mic for this page and try again.';return;}
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
  src.connect(analyser);buf=new Float32Array(analyser.fftSize);
  samples=[];score=null;t0=audioCtx.currentTime;recording=true;
  $('rec').classList.add('on');$('recLabel').textContent='Listening';$('recSub').textContent='tap to finish';
  $('empty').classList.add('hide');setButtons();
  loop();
}
function loop(){
  if(!recording)return;
  analyser.getFloatTimeDomainData(buf);
  const f=detect(buf,audioCtx.sampleRate);
  const t=audioCtx.currentTime-t0;
  liveMidi=f?f2m(f):null;
  samples.push({t,m:liveMidi});
  const st=$('status');
  st.innerHTML=f?`<b>${mname(Math.round(liveMidi))}</b>${f.toFixed(1)} Hz`:`<b>·</b>listening`;
  draw();
  rafId=requestAnimationFrame(loop);
}
function stop(){
  recording=false;cancelAnimationFrame(rafId);
  stream&&stream.getTracks().forEach(t=>t.stop());
  $('rec').classList.remove('on');$('recLabel').textContent='Record';$('recSub').textContent='tap, sing, tap again';
  score=segment(samples);liveMidi=null;
  $('status').innerHTML=score.length?`<b>${score.filter(n=>n.m!=null).length}</b>notes`:`<b>—</b>nothing heard`;
  if(!score.length)$('empty').classList.remove('hide');
  setButtons();draw();renderList();
}
$('rec').onclick=()=>recording?stop():start();

// ---------- segmentation ----------
function segment(s){
  if(s.length<3)return [];
  // median smooth over 5
  const sm=s.map((x,i)=>{const w=s.slice(Math.max(0,i-2),i+3).map(v=>v.m).filter(v=>v!=null);
    if(w.length<3)return {t:x.t,m:null};w.sort((a,b)=>a-b);return {t:x.t,m:w[Math.floor(w.length/2)]};});
  // group into raw events
  const ev=[];let cur=null;
  for(const p of sm){
    if(p.m==null){ if(cur&&cur.m==null)cur.end=p.t; else{cur={m:null,start:p.t,end:p.t,vals:[]};ev.push(cur);} continue;}
    if(cur&&cur.m!=null&&Math.abs(p.m-cur.center)<0.65){cur.end=p.t;cur.vals.push(p.m);cur.center=cur.vals.reduce((a,b)=>a+b)/cur.vals.length;}
    else{cur={m:Math.round(p.m),center:p.m,start:p.t,end:p.t,vals:[p.m]};ev.push(cur);}
  }
  // trim leading/trailing silence, drop blips
  while(ev.length&&ev[0].m==null)ev.shift();
  while(ev.length&&ev[ev.length-1].m==null)ev.pop();
  const MIN=0.09,out=[];
  for(const e of ev){
    const d=e.end-e.start;
    if(e.m!=null)e.m=Math.round(e.vals.reduce((a,b)=>a+b)/e.vals.length);
    if(d<MIN&&out.length){out[out.length-1].end=e.end;continue;}
    if(e.m==null&&d<0.12&&out.length){out[out.length-1].end=e.end;continue;}
    if(out.length&&out[out.length-1].m===e.m){out[out.length-1].end=e.end;continue;}
    out.push(e);
  }
  // quantize to eighths
  const unit=60/ +$('bpm').value/2;
  const q=[];
  for(const e of out){
    let len=Math.round((e.end-e.start)/unit);
    if(len<1){if(e.m==null)continue;len=1;}
    if(q.length&&q[q.length-1].m===e.m){q[q.length-1].len+=len;continue;}
    q.push({m:e.m,len});
  }
  // octave shift so the phrase sits on a treble staff
  const ms=q.filter(n=>n.m!=null).map(n=>n.m);
  if(ms.length){const med=ms.sort((a,b)=>a-b)[Math.floor(ms.length/2)];octaveShift=med<60?12:med>84?-12:0;}
  return q;
}

// ---------- layout into bars with ties ----------
const SPLIT={1:[1],2:[2],3:[3],4:[4],5:[4,1],6:[6],7:[6,1],8:[8]};
function layout(q){
  const segs=[];let pos=0;
  for(const n of q){
    let rem=n.len;
    while(rem>0){
      const room=8-(pos%8),fit=Math.min(rem,room);
      const parts=SPLIT[fit];
      parts.forEach((L,i)=>{segs.push({m:n.m,len:L,pos,tie:(i<parts.length-1)||(rem-fit>0)});pos+=L;});
      rem-=fit;
    }
  }
  return segs;
}

// ---------- drawing ----------
const S=10;// staff space px
function resize(){const r=cv.parentElement.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv._w=r.width;draw();}
window.addEventListener('resize',resize);
function sizeCanvas(h){const dpr=window.devicePixelRatio||1;cv.height=h*dpr;cv.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}

function staffLines(y,x0,x1){ctx.strokeStyle='#5C6A63';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x0,y+i*S+.5);ctx.lineTo(x1,y+i*S+.5);ctx.stroke();}}
function clef(x,y){ctx.fillStyle='#14201B';ctx.font=`${S*6.9}px "Noto Music","Segoe UI Symbol","Apple Symbols",serif`;ctx.textBaseline='alphabetic';ctx.fillText('\u{1D11E}',x,y+S*4.9);}
const yFor=(top,d)=>top+(38-d)*S/2; // F5 = top line (diatonic 38)

function draw(){
  const W=cv._w||cv.clientWidth;if(!W)return;
  const unitW=Math.max(14,Math.min(22,(W-120)/32));
  const barW=8*unitW+18, left=64, perLine=Math.max(1,Math.floor((W-left-10)/barW));
  const segs=score?layout(score):[];
  const bars=score?Math.max(1,Math.ceil((segs.length?segs[segs.length-1].pos+segs[segs.length-1].len:1)/8)):1;
  const lines=recording?1:Math.max(1,Math.ceil(bars/perLine));
  const lineH=S*13, top0=S*4.5;
  sizeCanvas(top0+lines*lineH);
  ctx.clearRect(0,0,W,cv.height);

  for(let l=0;l<lines;l++){
    const top=top0+l*lineH;
    const nb=recording?perLine:Math.min(perLine,bars-l*perLine);
    const x1=left+nb*barW;
    staffLines(top,12,x1);clef(18,top);
    if(l===0&&octaveShift&&!recording){ctx.fillStyle='#4A5751';ctx.font='11px "IBM Plex Mono",monospace';ctx.fillText(octaveShift>0?'8vb':'8va',18,top+S*6.2);}
    if(l===0){ctx.fillStyle='#14201B';ctx.font=`500 ${S*1.9}px "Fraunces",serif`;ctx.fillText('4',left-18,top+S*1.85);ctx.fillText('4',left-18,top+S*3.85);}
    ctx.strokeStyle='#14201B';ctx.lineWidth=1;
    for(let b=0;b<=nb;b++){const x=left+b*barW-9;ctx.beginPath();ctx.moveTo(x+.5,top);ctx.lineTo(x+.5,top+4*S);ctx.stroke();}
    if(!recording&&l===lines-1){const x=left+nb*barW-9;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+4,top);ctx.lineTo(x+4,top+4*S);ctx.stroke();}
  }

  if(recording){ // live pitch trace: the last ~6 seconds scroll across the first system
    const top=top0,win=6,now=samples.length?samples[samples.length-1].t:0,x0=left,x1=left+perLine*barW-9;
    ctx.save();ctx.beginPath();ctx.rect(x0,top-S*4,x1-x0,S*12);ctx.clip();
    ctx.strokeStyle='#2D6A4F';ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();let pen=false;
    for(const p of samples){
      const x=x0+(x1-x0)*(1-(now-p.t)/win);if(x<x0)continue;
      if(p.m==null){pen=false;continue;}
      const y=yFor(top,diatF(p.m));
      pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true;
    }
    ctx.stroke();
    if(liveMidi!=null){const y=yFor(top,diatF(liveMidi));ctx.fillStyle='#2D6A4F';ctx.beginPath();ctx.ellipse(x1-2,y,S*.62,S*.5,-.3,0,7);ctx.fill();
      ctx.fillStyle='rgba(45,106,79,.18)';ctx.fillRect(x0,y-1.5,x1-x0,3);}
    ctx.restore();return;
  }

  // committed notes
  let prev=null;
  segs.forEach(sg=>{
    const bar=Math.floor(sg.pos/8),l=Math.floor(bar/perLine),top=top0+l*lineH;
    const x=left+(bar%perLine)*barW+(sg.pos%8)*unitW+4;
    if(sg.m==null){rest(x,top,sg.len);prev=null;return;}
    const m=sg.m+octaveShift,d=diat(m),y=yFor(top,d);
    ctx.fillStyle='#14201B';ctx.strokeStyle='#14201B';ctx.lineWidth=1.3;
    // ledger lines
    for(let dd=40;dd<=d;dd+=2){ctx.beginPath();ctx.moveTo(x-S*.95,yFor(top,dd)+.5);ctx.lineTo(x+S*.95,yFor(top,dd)+.5);ctx.stroke();}
    for(let dd=28;dd>=d;dd-=2){ctx.beginPath();ctx.moveTo(x-S*.95,yFor(top,dd)+.5);ctx.lineTo(x+S*.95,yFor(top,dd)+.5);ctx.stroke();}
    // accidental
    if(SHARP[((m%12)+12)%12]){ctx.font=`${S*1.6}px serif`;ctx.fillText('\u266F',x-S*1.75,y+S*.55);}
    // head
    const hollow=sg.len>=4;ctx.save();ctx.translate(x,y);ctx.rotate(-.35);ctx.beginPath();ctx.ellipse(0,0,S*.62,S*.45,0,0,7);
    if(hollow){ctx.lineWidth=1.8;ctx.stroke();}else ctx.fill();ctx.restore();
    if(sg.len===3||sg.len===6){ctx.beginPath();ctx.arc(x+S*.95,(d%2===0)?y-S*.5:y,1.7,0,7);ctx.fill();}
    // stem + flag
    if(sg.len<8){
      const up=d<34,sx=up?x+S*.58:x-S*.58,sy=up?y-S*3.3:y+S*3.3;
      ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx,sy);ctx.stroke();
      if(sg.len===1){ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+S*.2,sy+(up?S*.9:-S*.9),sx+S*1.2,sy+(up?S*1.1:-S*1.1),sx+S*.7,sy+(up?S*2.2:-S*2.2));ctx.stroke();}
    }
    // tie from previous
    if(prev&&prev.tie&&prev.m===sg.m){
      const sameLine=prev.top===top;const px=sameLine?prev.x:x-S*3;
      const yy=y+(d<34?S*.8:-S*.8);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(px+S*.5,yy);
      ctx.quadraticCurveTo((px+x)/2,yy+(d<34?S*.9:-S*.9),x-S*.5,yy);ctx.stroke();
    }
    prev={x,top,tie:sg.tie,m:sg.m};
  });
}
function rest(x,top,len){
  ctx.fillStyle='#14201B';ctx.strokeStyle='#14201B';
  if(len>=8){ctx.fillRect(x-S*.6,top+S,S*1.2,S*.45);return;}
  if(len>=4){ctx.fillRect(x-S*.6,top+S*1.55,S*1.2,S*.45);if(len===6)dot();return;}
  if(len>=2){ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-S*.3,top+S*.9);ctx.lineTo(x+S*.4,top+S*1.7);ctx.lineTo(x-S*.25,top+S*2.4);ctx.lineTo(x+S*.35,top+S*3.2);ctx.stroke();if(len===3)dot();return;}
  ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x-S*.25,top+S*1.5,S*.22,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-S*.05,top+S*1.5);ctx.lineTo(x+S*.45,top+S*1.4);ctx.lineTo(x,top+S*3);ctx.stroke();
  function dot(){ctx.beginPath();ctx.arc(x+S*.95,top+S*1.5,1.7,0,7);ctx.fill();}
}

// ---------- list, playback, export ----------
const DUR={1:'♪',2:'♩',3:'♩.',4:'𝅗𝅥',5:'𝅗𝅥+♪',6:'𝅗𝅥.',7:'𝅗𝅥.+♪',8:'𝅝'};
const durLabel=l=>DUR[l]||`${l}×♪`;
function renderList(){
  $('notes').innerHTML=score?score.map(n=>`<span>${n.m==null?'rest':mname(n.m)} ${durLabel(n.len)}</span>`).join(''):'';
}
$('play').onclick=async()=>{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();
  const unit=60/ +$('bpm').value/2;let t=audioCtx.currentTime+.05;
  for(const n of score){
    if(n.m!=null){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=m2f(n.m);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.setTargetAtTime(0,t+n.len*unit-.06,.03);
      o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+n.len*unit);}
    t+=n.len*unit;
  }
};
function abc(){
  const bpm=$('bpm').value;
  const tok=n=>{ if(n.m==null)return 'z'+n.len;
    const m=n.m+octaveShift,pc=((m%12)+12)%12,oct=Math.floor(m/12)-1;
    let s=(SHARP[pc]?'^':'')+NAMES[pc][0];
    if(oct>=5)s=s.toLowerCase()+"'".repeat(oct-5); else s+=','.repeat(4-oct);
    return s+n.len;};
  let body='',pos=0;
  for(const n of score){body+=tok(n)+' ';pos+=n.len;if(pos%8===0)body+='| ';}
  return `X:1\nT:Sung phrase\nM:4/4\nL:1/8\nQ:1/4=${bpm}\nK:C\n${body.trim()}|]`;
}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(abc());$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy ABC',1400);}
  catch{prompt('Copy this ABC notation:',abc());}};
$('clear').onclick=()=>{score=null;samples=[];octaveShift=0;$('empty').classList.remove('hide');$('status').innerHTML='<b>—</b>ready';renderList();setButtons();draw();};
$('bpm').oninput=e=>{$('bpmv').textContent=e.target.value;if(score&&samples.length){score=segment(samples);draw();renderList();}};
function setButtons(){const has=!!(score&&score.length)&&!recording;['play','copy','clear'].forEach(id=>$(id).disabled=!has);}
resize();
</script>
</body>
</html>
